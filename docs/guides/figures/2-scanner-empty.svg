<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="299" fill="none" stroke="#cbd5e1"/>

  <text x="28" y="42" fill="#0f172a" font-size="17" font-weight="600">Batch Assignment</text>

  <!-- batch picker -->
  <text x="28" y="76" fill="#475569" font-size="12">Select a batch</text>
  <rect x="28" y="86" width="420" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="42" y="106" fill="#94a3b8" font-size="12">Select a batch</text>
  <text x="428" y="106" fill="#64748b" font-size="11">▾</text>

  <!-- empty state -->
  <rect x="28" y="132" width="420" height="86" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="46" y="160" fill="#92400e" font-size="12.5" font-weight="600">No open batches</text>
  <text x="46" y="181" fill="#a16207" font-size="11.5">Create one on the Batches page first.</text>
  <rect x="46" y="192" width="112" height="26" rx="6" fill="#2563eb"/>
  <text x="102" y="209" fill="#ffffff" font-size="11.5" font-weight="600" text-anchor="middle">Create Batch</text>

  <!-- disabled scanner -->
  <rect x="28" y="236" width="420" height="46" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="46" y="264" fill="#94a3b8" font-size="12">Select a batch before scanning</text>

  <!-- session stats -->
  <rect x="470" y="76" width="262" height="206" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="490" y="102" fill="#334155" font-size="12.5" font-weight="600">Session stats</text>
  <line x1="490" y1="114" x2="712" y2="114" stroke="#e2e8f0"/>
  <text x="490" y="140" fill="#64748b" font-size="11.5">Packages</text>
  <text x="712" y="140" fill="#0f172a" font-size="11.5" text-anchor="end">0</text>
  <text x="490" y="168" fill="#64748b" font-size="11.5">Total weight</text>
  <text x="712" y="168" fill="#0f172a" font-size="11.5" text-anchor="end">0.00 kg</text>
  <text x="490" y="196" fill="#64748b" font-size="11.5">Total CBM</text>
  <text x="712" y="196" fill="#0f172a" font-size="11.5" text-anchor="end">0.000</text>
  <text x="490" y="224" fill="#64748b" font-size="11.5">Incomplete data</text>
  <text x="712" y="224" fill="#0f172a" font-size="11.5" text-anchor="end">0</text>
</svg>
