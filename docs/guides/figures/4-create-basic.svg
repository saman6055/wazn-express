<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="340" fill="#f1f5f9"/>
  <rect x="60.5" y="12.5" width="639" height="315" rx="10" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="84" y="46" fill="#0f172a" font-size="16" font-weight="600">New Batch</text>
  <text x="672" y="46" fill="#94a3b8" font-size="15" text-anchor="middle">✕</text>

  <!-- tabs -->
  <line x1="84" y1="70" x2="676" y2="70" stroke="#e2e8f0"/>
  <text x="84" y="64" fill="#2563eb" font-size="12" font-weight="600">Basic Information</text>
  <rect x="82" y="68" width="122" height="3" fill="#2563eb"/>
  <text x="228" y="64" fill="#94a3b8" font-size="12">Volume &amp; Cost</text>
  <text x="348" y="64" fill="#94a3b8" font-size="12">Selling Price</text>

  <!-- fields -->
  <g font-size="11.5">
    <text x="84" y="98" fill="#475569">Batch Code</text>
    <rect x="84" y="106" width="270" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="96" y="125" fill="#0f172a" font-family="Consolas, monospace">AIR-2026-041</text>
    <text x="366" y="125" fill="#94a3b8" font-size="10.5">optional — left empty, one is made for you</text>

    <text x="84" y="158" fill="#475569">Origin Warehouse <tspan fill="#dc2626">*</tspan></text>
    <rect x="84" y="166" width="270" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="96" y="185" fill="#0f172a">Guangzhou Warehouse</text>
    <text x="336" y="185" fill="#64748b" font-size="10.5">▾</text>

    <text x="406" y="158" fill="#475569">Destination <tspan fill="#dc2626">*</tspan></text>
    <rect x="406" y="166" width="270" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="418" y="185" fill="#0f172a">Iraq</text>
    <text x="658" y="185" fill="#64748b" font-size="10.5">▾</text>

    <text x="84" y="218" fill="#475569">Shipping Type <tspan fill="#dc2626">*</tspan></text>
    <rect x="84" y="226" width="180" height="30" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="174" y="246" fill="#1d4ed8" font-size="11.5" font-weight="600" text-anchor="middle">Air Regular</text>
    <rect x="274" y="226" width="180" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="364" y="246" fill="#475569" font-size="11.5" text-anchor="middle">Air Irregular</text>
    <rect x="464" y="226" width="180" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="554" y="246" fill="#475569" font-size="11.5" text-anchor="middle">Sea Freight</text>

    <text x="84" y="284" fill="#94a3b8" font-size="10.5">Airline Name, Flight Number, AWB and Shipping Company appear below — all optional, and addable later from Edit.</text>
  </g>

  <rect x="546" y="292" width="130" height="30" rx="6" fill="#2563eb"/>
  <text x="611" y="312" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Create Batch</text>
  <rect x="452" y="292" width="80" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="492" y="312" fill="#475569" font-size="12" text-anchor="middle">Cancel</text>
</svg>
