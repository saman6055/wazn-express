<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="300" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="759" height="299" fill="none" stroke="#cbd5e1"/>

  <text x="28" y="42" fill="#0f172a" font-size="17" font-weight="600">Batches</text>
  <text x="28" y="63" fill="#64748b" font-size="11.5">All shipments, newest first</text>

  <!-- the button the step points at -->
  <rect x="612" y="28" width="120" height="32" rx="6" fill="#2563eb"/>
  <text x="672" y="49" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="middle">+ New Batch</text>

  <!-- table -->
  <rect x="28" y="84" width="704" height="34" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="46" y="106" fill="#475569" font-size="11.5" font-weight="600">Batch Code</text>
  <text x="220" y="106" fill="#475569" font-size="11.5" font-weight="600">Type</text>
  <text x="340" y="106" fill="#475569" font-size="11.5" font-weight="600">Status</text>
  <text x="470" y="106" fill="#475569" font-size="11.5" font-weight="600">Packages</text>
  <text x="600" y="106" fill="#475569" font-size="11.5" font-weight="600">Scan</text>

  <g font-size="11.5">
    <rect x="28" y="118" width="704" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="46" y="143" fill="#0f172a" font-family="Consolas, monospace">AIR-2026-041</text>
    <text x="220" y="143" fill="#334155">Air Regular</text>
    <rect x="340" y="128" width="76" height="20" rx="10" fill="#dbeafe"/>
    <text x="378" y="142" fill="#1d4ed8" font-size="10.5" text-anchor="middle">Preparing</text>
    <text x="470" y="143" fill="#334155">0</text>
    <rect x="600" y="128" width="60" height="22" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="630" y="143" fill="#334155" font-size="10.5" text-anchor="middle">Scan</text>

    <rect x="28" y="158" width="704" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="46" y="183" fill="#0f172a" font-family="Consolas, monospace">SEA-2026-012</text>
    <text x="220" y="183" fill="#334155">Sea Freight</text>
    <rect x="340" y="168" width="76" height="20" rx="10" fill="#fef3c7"/>
    <text x="378" y="182" fill="#92400e" font-size="10.5" text-anchor="middle">In Transit</text>
    <text x="470" y="183" fill="#334155">64</text>
    <rect x="600" y="168" width="60" height="22" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="630" y="183" fill="#334155" font-size="10.5" text-anchor="middle">Scan</text>

    <rect x="28" y="198" width="704" height="40" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="46" y="223" fill="#0f172a" font-family="Consolas, monospace">AIR-2026-039</text>
    <text x="220" y="223" fill="#334155">Air Regular</text>
    <rect x="340" y="208" width="76" height="20" rx="10" fill="#dcfce7"/>
    <text x="378" y="222" fill="#166534" font-size="10.5" text-anchor="middle">Delivered</text>
    <text x="470" y="223" fill="#334155">31</text>
  </g>

  <text x="28" y="266" fill="#64748b" font-size="11">The scan button on a row opens the scanner with that batch already selected.</text>
</svg>
