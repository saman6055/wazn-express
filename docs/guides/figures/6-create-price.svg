<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="760" height="300" fill="#f1f5f9"/>
  <rect x="60.5" y="12.5" width="639" height="275" rx="10" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="84" y="46" fill="#0f172a" font-size="16" font-weight="600">New Batch</text>
  <text x="672" y="46" fill="#94a3b8" font-size="15" text-anchor="middle">✕</text>

  <line x1="84" y1="70" x2="676" y2="70" stroke="#e2e8f0"/>
  <text x="84" y="64" fill="#94a3b8" font-size="12">Basic Information</text>
  <text x="228" y="64" fill="#94a3b8" font-size="12">Volume &amp; Cost</text>
  <text x="348" y="64" fill="#2563eb" font-size="12" font-weight="600">Selling Price</text>
  <rect x="346" y="68" width="94" height="3" fill="#2563eb"/>

  <g font-size="11.5">
    <text x="84" y="102" fill="#475569">Price per KG (USD)</text>
    <rect x="84" y="110" width="260" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="96" y="129" fill="#0f172a" font-family="Consolas, monospace">11.00</text>
    <text x="356" y="129" fill="#94a3b8" font-size="10.5">what the customer pays</text>

    <rect x="84" y="158" width="592" height="72" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="102" y="182" fill="#334155" font-weight="600">Special Pricing</text>
    <text x="102" y="203" fill="#64748b" font-size="10.5">Leave this alone unless the office has told you a particular customer has an agreed rate.</text>
    <rect x="102" y="210" width="140" height="12" rx="6" fill="#e2e8f0"/>
  </g>

  <rect x="546" y="244" width="130" height="30" rx="6" fill="#2563eb"/>
  <text x="611" y="264" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Create Batch</text>
</svg>
