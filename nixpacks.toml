# Nixpacks configuration for Coolify deployment
# This tells Nixpacks how to build and run the application

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install -g pnpm", "pnpm install"]

[phases.build]
cmds = ["pnpm build"]

[start]
cmd = "pnpm start"

# Health check for Coolify/orchestration (optional)
# GET /api/health returns { status: "ok", uptime, timestamp, version }
# GET /api/health/db returns DB connectivity status
[variables]
NIXPACKS_HEALTHCHECK_PATH = "/api/health"
NIXPACKS_HEALTHCHECK_TIMEOUT = "5"
