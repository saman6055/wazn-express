<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>Wazn Express</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e293b" />
    <meta name="description" content="Wazn Express - International Shipping & Logistics from China to Iraq" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wazn Express" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- PWA Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/icons/icon-120x120.png" />
    
    <!-- Splash Screens for iOS -->
    <link rel="apple-touch-startup-image" href="/icons/splash-640x1136.png" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="/icons/splash-1242x2208.png" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3)" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Put the saved theme on <html> before the first paint.

      Without this the page paints light, then flips to dark the moment React
      mounts — and the boot screen below has no way to know which colours to
      use. Reading localStorage here costs nothing and removes the flash.
    -->
    <script>
      try {
        if (localStorage.getItem("theme") === "dark") document.documentElement.classList.add("dark");
      } catch (e) { /* private mode: light is a fine default */ }
    </script>

    <!--
      Boot screen only. Everything here is scoped to .wazn-boot, which React
      replaces the instant it mounts.

      It used to live in a style="" attribute on <body>, which was the single
      biggest readability bug in the app: an inline `color:#0f172a` outranks
      every stylesheet rule, so every element that did not name its own colour
      inherited near-black — headings, field labels, input values, table
      figures. On the light theme nobody noticed. On the dark theme it was
      black text on a black page, on every screen. The inline
      `font-family: system-ui` did the same to the Rudaw typeface.
    -->
    <style>
      body { margin: 0; }
      .wazn-boot {
        display: flex; min-height: 100vh; flex-direction: column;
        align-items: center; justify-content: center; gap: 1rem;
        background: #f1f5f9; color: #0f172a; font-family: system-ui, sans-serif;
      }
      html.dark .wazn-boot { background: #111418; color: #e8ecf2; }
      .wazn-boot-spinner {
        width: 40px; height: 40px; border: 2px solid #e2e8f0;
        border-top-color: #0d9488; border-radius: 50%;
        animation: root-spin 0.8s linear infinite;
      }
      html.dark .wazn-boot-spinner { border-color: #2a2f38; border-top-color: #2dd4bf; }
      .wazn-boot p { margin: 0; font-size: 0.875rem; opacity: 0.7; }
      @keyframes root-spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Initial loading – replaced by React when app mounts. Prevents blank white page. -->
      <div class="wazn-boot">
        <div class="wazn-boot-spinner"></div>
        <p>Loading Wazn Express…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
